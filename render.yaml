# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: news-pilot
    runtime: node
    plan: starter
    region: singapore
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID_EN
        sync: false
      - key: ELEVENLABS_VOICE_ID_HI
        sync: false
      - key: CRON_SECRET
        sync: false
